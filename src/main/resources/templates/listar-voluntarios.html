<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Voluntários Cadastrados</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .table {
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .table th, .table td {
            vertical-align: middle;
            text-align: center;
            padding: 12px;
            border: 1px solid #ddd;
        }

        .table-light {
            background: #f8f9fa;
        }

        .btn-custom {
            font-size: 1rem;
            padding: 12px 25px;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease, transform 0.3s ease;
            background-color: #4CAF50;
            color: white;
            display: inline-flex; /* Garantir alinhamento */
            justify-content: center; /* Centralizar conteúdo dentro do botão */
            align-items: center; /* Centralizar conteúdo verticalmente */
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            background-color: #388e3c;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
            border: none;
            font-size: 1rem;
            padding: 12px 25px;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            background-color: #5a6268;
        }

        .footer-buttons {
            margin-top: 30px;
            text-align: center;
        }

        /* Customização das mensagens */
        .alert {
            margin-top: 20px;
            border-radius: 10px;
        }

        .page-header {
            margin-bottom: 20px;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .card-body {
            padding: 25px;
        }

        .card-title {
            font-size: 1.75rem;
        }

        .btn-table {
            display: inline-block;
            padding: 10px 15px;
            margin: 10px 5px;
            font-size: 1rem;
            border-radius: 5px;
        }

        .btn-edit {
            background-color: #ffc107;
            color: white;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
        }

        .btn-edit:hover {
            background-color: #e0a800;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

    </style>
</head>
<body class="container mt-4">

<div class="page-header text-center mb-5">
    <h2>Voluntários Cadastrados</h2>
</div>

<!-- Mensagens -->
<div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
<div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

<!-- Tabela de voluntários -->
<div class="card">
    <div class="card-body">
        <table class="table table-bordered table-hover">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Email</th>
                <th>CEP</th>
                <th>Instituição</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="voluntario : ${voluntarios}">
                <td th:text="${voluntario.id}"></td>
                <td th:text="${voluntario.nome}"></td>
                <td th:text="${voluntario.email}"></td>
                <td th:text="${voluntario.cep}"></td>
                <td th:text="${voluntario.instituicao != null ? voluntario.instituicao.nome : 'Nenhuma'}"></td>
                <td>
                    <a th:href="@{/voluntarios/editar/{id}(id=${voluntario.id})}" class="btn btn-sm btn-edit btn-table">Editar</a>
                    <a th:href="@{/voluntarios/excluir/{id}(id=${voluntario.id})}" class="btn btn-sm btn-delete btn-table" onclick="return confirm('Tem certeza que deseja excluir este voluntário?')">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Botões de ação -->
<div class="footer-buttons">
    <a href="/voluntarios/cadastrar" class="btn btn-success btn-custom">+ Cadastrar Novo Voluntário</a>
    <a href="/" class="btn btn-secondary btn-custom">⬅ Voltar</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

</body>
</html>
