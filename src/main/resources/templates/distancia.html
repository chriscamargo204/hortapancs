<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Calcular Distância entre CEPs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <h2 class="mb-4 text-center">Calcular Distância entre CEPs</h2>

  <form th:action="@{/teste/distancia}" method="get" class="card p-4 shadow-sm">
    <div class="row mb-3">
      <div class="col-md-6">
        <label for="cep1" class="form-label">CEP 1:</label>
        <input type="text" id="cep1" name="cep1" class="form-control" placeholder="Ex: 82840-330" required>
      </div>
      <div class="col-md-6">
        <label for="cep2" class="form-label">CEP 2:</label>
        <input type="text" id="cep2" name="cep2" class="form-control" placeholder="Ex: 80010-000" required>
      </div>
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-primary">Calcular Distância</button>
    </div>
  </form>

  <div class="mt-4 text-center">
    <a href="/" class="btn btn-secondary">Voltar à Página Inicial</a>
  </div>
</div>

</body>
</html>
