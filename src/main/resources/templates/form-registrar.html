<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Registrar</title>
</head>
<body>

<h2>Registrar Usuário</h2>

<form th:action="@{/registrar}" th:object="${usuario}" method="post">
  <label for="username">Nome de Usuário:</label>
  <input type="text" id="username" th:field="*{username}" required><br>

  <label for="password">Senha:</label>
  <input type="password" id="password" th:field="*{password}" required><br>

  <button type="submit">Registrar</button>
</form>

<div th:if="${mensagem}" th:text="${mensagem}"></div>
<div th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
<div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

</body>
</html>
