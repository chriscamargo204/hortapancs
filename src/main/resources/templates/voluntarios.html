<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Voluntários</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h2>Voluntários Cadastrados</h2>

<a th:href="@{/}" class="btn btn-secondary mb-3">← Voltar</a>

<table class="table table-bordered table-striped">
  <thead class="table-dark">
  <tr>
    <th>Nome</th>
    <th>Email</th>
    <th>CEP</th>
    <th>Instituição Associada</th>
    <th>Ações</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="voluntario : ${voluntarios}">
    <td th:text="${voluntario.nome}">Nome</td>
    <td th:text="${voluntario.email}">Email</td>
    <td th:text="${voluntario.cep}">CEP</td>
    <td>
      <span th:text="${voluntario.instituicao?.nome}">Instituição</span>
      <span th:if="${distanciasVoluntarios != null && distanciasVoluntarios[voluntario.id] != null}"
            th:text="' - ' + #numbers.formatDecimal(distanciasVoluntarios[voluntario.id], 1, 'COMMA', 2, 'POINT') + ' km'">
      </span>
    </td>
    <td>
      <a th:href="@{|/voluntarios/editar/${voluntario.id}|}" class="btn btn-primary btn-sm">Editar</a>
      <a th:href="@{|/voluntarios/excluir/${voluntario.id}|}" class="btn btn-danger btn-sm"
         onclick="return confirm('Tem certeza que deseja excluir este voluntário?')">Excluir</a>
    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
