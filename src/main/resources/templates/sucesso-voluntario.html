<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Voluntário - Sucesso</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      background: linear-gradient(to right, #56ccf2, #2f80ed);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    .container {
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      padding: 40px;
      margin-top: 100px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    h2 {
      text-align: center;
      font-size: 2.5rem;
      color: #333;
    }
    .btn {
      width: 100%;
      padding: 15px;
      font-size: 1.2rem;
      border-radius: 30px;
      margin-top: 20px;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: #4caf50;
      border: none;
    }
    .btn-primary:hover {
      background: #45a049;
    }
    .btn-secondary {
      background: #f44336;
      border: none;
    }
    .btn-secondary:hover {
      background: #e53935;
    }
    .message {
      font-size: 1.2rem;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Voluntário Cadastrado com Sucesso!</h2>

  <!-- Mensagem caso não haja instituições disponíveis em até 10km -->
  <div th:if="${param.nenhumaInstituicao}">
    <p class="message">Não há instituições disponíveis em até 10km para vincular.</p>
  </div>

  <!-- Mensagem caso as instituições tenham sido vinculadas com sucesso -->
  <div th:unless="${param.nenhumaInstituicao}">
    <p class="message">Instituições foram vinculadas com sucesso ao voluntário.</p>
  </div>

  <!-- Botões para redirecionar para outras páginas -->
  <a href="/" class="btn btn-primary">Voltar ao Início</a>
  <a href="/voluntarios/listar" class="btn btn-secondary">Ver Voluntários</a>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
