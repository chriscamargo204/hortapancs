<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fragementos</title>
</head>
<body>

<!-- Fragmento de conteúdo principal -->
<div th:fragment="conteudo">
    <h2 class="text-center mb-4">Cadastro de Voluntário</h2>

    <!-- Formulário de cadastro de voluntário -->
    <form th:action="@{/voluntarios/salvar}" th:object="${voluntario}" method="post" class="mx-auto" style="max-width: 500px;">
        <div class="form-group mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" class="form-control" required>
        </div>
        <div class="form-group mb-3">
            <label for="cep" class="form-label">CEP:</label>
            <input type="text" id="cep" th:field="*{cep}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Salvar</button>
    </form>
</div>

</body>
</html>
